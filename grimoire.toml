# Grimoire book configuration for the @deckyard/sealbox documentation.

[book]
title = "@deckyard/sealbox"
description = "One-call encryption formats on top of crypto: sealed boxes, encrypt-then-MAC, Fernet"
language = "en"
src = "docs"

[build]
out = "site"
clean = true
jobs = 0

[html]
theme = "nordic"
mode = "auto"
navPosition = "left"
tocPosition = "right"
tocDepth = 3
sectionNumbers = true
titleUrl = "https://deckyard.github.io/deck-sealbox/"
repoUrl = "https://github.com/deckyard/deck-sealbox"
repoLabel = "Source"
editUrl = "https://github.com/deckyard/deck-sealbox/edit/main/docs/{path}"

[highlight]
enabled = true

[search]
enabled = true

[pdf]
enabled = false
